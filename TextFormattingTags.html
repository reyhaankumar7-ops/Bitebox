<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting Tags</title>
</head>
<body>
    <h1>This is the Heading</h1>

    <p>This is a <b>Bold</b> tag</p>

    <p>This is a <strong>Strong</strong> tag</p>

    <p>This is <i>Italic</i> tag</p>

    <p>This is <em>Italic</em> tag</p>

    <p>This is <u>underline</u> tag</p>

    <P>This is <mark>highligt</mark> tag</P>

    <p>This is <small>small</small> tag</p>

    <p>Old price:800 New price: <del>1000</del></p>

    <p>Water Formula: H<sub>2</sub>O</p>

    <P>Wter Boiling Point:100<sup>O</sup>C</P>
</body>
</html>
