<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration-Bite Box</title>
    <link rel="icon" type="image/x-icon" href="./Deliveroo-Logo.wine.svg">
</head>

<body>
    <nav>
        <img src="./Deliveroo-Logo.wine.svg" alt="logo image" width="350" height="200">
    </nav>
    <main>
        <div>
            <form>
                <div>
                    <h2>Registartion</h2>
                </div>

                <div>
                    <label for="Full Name"></label>
                    <input type="text" placeholder="Enter Name" required>
                     <br>
                    <label for="email"></label>
                    <input type="email" placeholder="Enter Email" required>
                </div>

                <div>
                    <label for="create password"></label>
                    <input type="text" placeholder="Enter Password" required>
                    <br>
                    <label for="Re-Enter Password"></label>
                    <input type="text" placeholder="Re-Enter Password" required>
                </div>

                <div>
                    <label for="Age"></label>
                    <input type="text" placeholder="Age">
                </div>

                <div>
                    <label>Select Gender</label>
                    <br>
                    <input type="radio" value="Male" /> <label>Male</label>
                    <br>
                    <input type="radio" /> <label>Female</label>
                </div>

                <div>
                    <label>Select Date of Birth</label>
                    <input type="date">
                    <br>
                    <label>Address</label>
                    <textarea rows="5" cols="30"></textarea>
                </div>

                <div>
                    <label>Ph.no</label>
                    <input type="text" placeholder="Enter Ph.No">
                </div>

                <div>
                    <a href="./login.html"><button type="submit"><b>Register</b></button></a>
                </div>

            </form>
        </div>
    </main>
</body>

</html>
